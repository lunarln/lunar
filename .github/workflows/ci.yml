name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev zlib1g-dev libzstd-dev
          echo "LLVM_CONFIG=/usr/bin/llvm-config-20" >> "$GITHUB_ENV"

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "LLVM_CONFIG=$(brew --prefix llvm@20)/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Install LLVM 20 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "20.1.8"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          Invoke-WebRequest $url -OutFile llvm.exe
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\LLVM"
          "LLVM_SYS_201_PREFIX=C:\LLVM" >> $env:GITHUB_ENV
          "C:\LLVM\bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Check std for every OS
        shell: bash
        run: |
          for os in linux macos windows; do
            ./target/debug/lunar check --target-os "$os" examples/tour.ln
          done

      - name: Run the example
        shell: bash
        run: |
          ./target/debug/lunar run examples/arrays.ln
          ./target/debug/lunar test examples/arrays.ln
