name: CI

# The compiler is built from the released compiler named in
# craters/stage0.txt (stage 0, with its own standard library): stage 1 is
# craters/ built by it, stage 2 is built by stage 1 and stage 3 by stage 2,
# and stages 2 and 3 must be identical. Every test runs against stage 2.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/llvm

      - uses: ./.github/actions/stage0

      # For the debugger tests (craters/lunar/src/debuginfo_tests.ln):
      # macOS has lldb with Xcode, LLVM's Windows build has llvm-pdbutil.
      - name: Install lldb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lldb-20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Bootstrap (stage 2 == stage 3)
        run: |
          tools/bootstrap.sh "$STAGE0" target/bootstrap
          # Stage 2, as a native path for the tests to run.
          dir=$(cd target/bootstrap/stage2 && { pwd -W 2>/dev/null || pwd; })
          exe=lunar
          if [ "$RUNNER_OS" = Windows ]; then exe=lunar.exe; fi
          echo "LUNAR_BIN=$dir/$exe" >> "$GITHUB_ENV"

      - name: Check std for every OS
        run: |
          for os in linux macos windows; do
            "$LUNAR_BIN" check --target-os "$os" examples/tour.ln
          done

      - name: Test the compiler's packages
        working-directory: craters
        run: |
          for manifest in */lunar.toml; do
            package=$(dirname "$manifest")
            if [ "$package" != lunar-tests ]; then
              "$LUNAR_BIN" test -p "$package"
            fi
          done

      # The command line, the package manager and the language server, run
      # as programs (craters/lunar-tests).
      - name: Test lunar
        working-directory: craters
        run: '"$LUNAR_BIN" test -p lunar-tests'
