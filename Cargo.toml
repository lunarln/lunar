[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lunarln/lunar"

[workspace.dependencies]
ln-ast = { path = "./crates/ln-ast" }
ln-codegen = { path = "./crates/ln-codegen" }
ln-diag = { path = "./crates/ln-diag" }
ln-driver = { path = "./crates/ln-driver" }
ln-lexer = { path = "./crates/ln-lexer" }
ln-parse-kit = { path = "./crates/ln-parse-kit" }
ln-parser = { path = "./crates/ln-parser" }
ln-sema = { path = "./crates/ln-sema" }

ariadne = "0.6"
logos = "0.16.1"
inkwell = { version = "0.11", default-features = false, features = ["llvm20-1-no-llvm-linking", "target-x86", "target-aarch64"] }
llvm-sys-201 = { package = "llvm-sys", version = "201", features = ["no-llvm-linking", "disable-alltargets-init"] }
cc = "1"
