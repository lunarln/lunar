[package]
name = "ln-driver"
description = "The `lunar` command line compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "lunar"
path = "src/main.rs"

[lib]
name = "ln_driver"
path = "src/lib.rs"

[dependencies]
ln-diag.workspace = true
ln-lexer.workspace = true
ln-parser.workspace = true
ln-sema.workspace = true
ln-codegen.workspace = true
clap = { version = "4.6", features = ["derive"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
semver = "1"

cc.workspace = true

[dev-dependencies]
serde_json = "1"
